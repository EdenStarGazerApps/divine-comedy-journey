<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Journey Through the Divine Comedy</title>
<meta property="og:title" content="Journey Through the Divine Comedy" />
<meta property="og:description" content="An illustrated, musical pilgrimage through Dante's Inferno, Purgatorio, and Paradiso, with Gustave Doré's engravings and Liszt's Dante Symphony." />
<meta property="og:image" content="https://commons.wikimedia.org/wiki/Special:FilePath/Gustave%20Dore%20Inferno34.jpg?width=1200" />
<style>
  :root{
    --ink:#1a1410; --parchment:#f3ead8; --gold:#c9a227; --gold2:#e8c76a;
    --inferno1:#1a0505; --inferno2:#7a1f0e; --ember:#ff7a3c;
    --purg1:#0d1428; --purg2:#3d5a80; --dawn:#9fb4d8;
    --par1:#1c2340; --par2:#87a7ff; --light:#fffbe8;
    --font-head:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --font-body:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--parchment);font-family:var(--font-body);line-height:1.65}
  h1,h2,h3{font-family:var(--font-head);font-weight:700;letter-spacing:.02em}
  a{color:var(--gold2)}
  /* ---------- NAV ---------- */
  nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:1rem;
      background:rgba(16,10,6,.92);backdrop-filter:blur(6px);padding:.7rem 1.2rem;border-bottom:1px solid #3a2a18}
  nav .brand{font-family:var(--font-head);color:var(--gold2);font-size:1.05rem;cursor:pointer;white-space:nowrap}
  nav .tabs{display:flex;gap:.2rem;flex-wrap:wrap}
  nav .tabs button{background:none;border:none;color:#cdbfa5;font-family:var(--font-body);font-size:.95rem;
      padding:.35rem .8rem;border-radius:999px;cursor:pointer}
  nav .tabs button:hover{color:var(--light)}
  nav .tabs button.active{background:#3a2a18;color:var(--gold2)}
  #progressWrap{flex:1;min-width:80px}
  #progressBar{height:6px;background:#2c2012;border-radius:999px;overflow:hidden}
  #progressFill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--ember));transition:width .5s ease}
  #progressLabel{font-size:.72rem;color:#a9966f;text-align:right;margin-top:2px}
  main{max-width:900px;margin:0 auto;padding:1.5rem 1.2rem 4rem}
  .hidden{display:none !important}
  /* ---------- HOME ---------- */
  .hero{position:relative;border:1px solid #3a2a18;border-radius:14px;overflow:hidden;margin-top:1rem}
  .hero .bg{height:340px;background:
     radial-gradient(ellipse 60% 50% at 30% 90%, rgba(255,122,60,.35), transparent 65%),
     radial-gradient(ellipse 70% 60% at 75% 15%, rgba(135,167,255,.22), transparent 70%),
     linear-gradient(160deg,#120404 0%, #1c0a08 38%, #0d1428 66%, #1c2340 100%);
     display:flex;align-items:center;justify-content:center}
  .hero .bg svg{width:100%;height:100%;opacity:.9}
  .hero .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.5rem}
  .hero h1{font-size:clamp(1.6rem,5vw,2.7rem);color:var(--light);text-shadow:0 2px 18px rgba(0,0,0,.8)}
  .hero .sub{margin-top:.5rem;color:#e4d6b8;font-style:italic;max-width:34rem;text-shadow:0 1px 8px rgba(0,0,0,.9)}
  .epigraph{margin:2rem auto 1rem;max-width:36rem;text-align:center;font-style:italic;color:#d8c8a4}
  .epigraph .attr{font-style:normal;font-size:.8rem;color:#a9966f;margin-top:.3rem}
  .home-actions{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin-top:1.4rem}
  .btn{font-family:var(--font-head);font-size:1rem;padding:.75rem 1.6rem;border-radius:999px;cursor:pointer;border:1px solid var(--gold);
       background:linear-gradient(180deg,#3a2a18,#241808);color:var(--gold2);transition:transform .15s ease,box-shadow .15s ease}
  .btn:hover{transform:translateY(-1px);box-shadow:0 4px 18px rgba(201,162,39,.25)}
  .btn.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#241808;border-color:var(--gold2);font-weight:700}
  .home-notes{margin-top:2.4rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
  .card{border:1px solid #3a2a18;border-radius:12px;padding:1.1rem;background:rgba(30,20,10,.5)}
  .card h3{color:var(--gold2);font-size:1rem;margin-bottom:.4rem}
  .card p{font-size:.9rem;color:#cdbfa5}
  /* ---------- JOURNEY MAP ---------- */
  .canticle{margin:2rem 0 1rem}
  .canticle h2{display:flex;align-items:center;gap:.7rem;font-size:1.35rem}
  .canticle .c-inferno{color:#ff9c6b}.canticle .c-purgatorio{color:var(--dawn)}.canticle .c-paradiso{color:var(--par2)}
  .c-desc{font-size:.85rem;color:#a9966f;font-style:italic;margin:.2rem 0 1rem}
  .level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.8rem}
  .lvl{border:1px solid #3a2a18;border-radius:10px;overflow:hidden;cursor:pointer;background:rgba(20,12,6,.6);
       transition:transform .15s ease,border-color .15s ease;position:relative}
  .lvl:hover{transform:translateY(-2px);border-color:var(--gold)}
  .lvl.locked{opacity:.5}
  .lvl .strip{height:56px;display:block;position:relative}
  .lvl .strip svg{width:100%;height:100%}
  .lvl .strip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .lvl .txt{padding:.6rem .7rem .8rem}
  .lvl .num{font-size:.68rem;letter-spacing:.12em;color:#a9966f;text-transform:uppercase}
  .lvl .name{font-family:var(--font-head);font-size:.95rem;color:var(--light);line-height:1.3;margin-top:.15rem}
  .lvl .done-badge{position:absolute;top:.4rem;right:.4rem;background:var(--gold);color:#241808;border-radius:999px;
       font-size:.62rem;font-weight:700;padding:.1rem .45rem}
  .lvl .here-badge{position:absolute;top:.4rem;left:.4rem;background:#ff7a3c;color:#1a0505;border-radius:999px;
       font-size:.62rem;font-weight:700;padding:.1rem .45rem}
  /* ---------- LEVEL VIEW ---------- */
  #levelView .crumbs{font-size:.78rem;color:#a9966f;letter-spacing:.08em;text-transform:uppercase}
  #levelView h2{font-size:clamp(1.4rem,4vw,2.1rem);margin:.2rem 0 .1rem}
  #levelView .epithet{font-style:italic;color:var(--gold2);margin-bottom:1rem}
  .level-art{display:grid;grid-template-columns:1fr;gap:1.2rem;margin-bottom:1.4rem}
  .artframe{border:1px solid #3a2a18;border-radius:12px;overflow:hidden;position:relative;min-height:240px;
       background:linear-gradient(160deg,#120404,#1c0a08)}
  .artframe svg.motif{width:100%;height:280px;display:block}
  .artframe img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .artframe .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.85));
       padding:1.6rem .9rem .5rem;font-size:.72rem;color:#d8c8a4;font-style:italic}
  .level-text p{max-width:40rem;color:#e7dcc3;margin-bottom:1rem}
  .level-quote{max-width:36rem;margin:1.4rem 0;padding:1.1rem 1.3rem;border-left:3px solid var(--gold);
       background:rgba(201,162,39,.06);border-radius:0 10px 10px 0}
  .level-quote .it{font-style:italic;color:var(--gold2)}
  .level-quote .en{margin-top:.4rem;color:#e7dcc3;font-size:.95rem}
  .level-quote .attr{margin-top:.5rem;font-size:.72rem;color:#a9966f}
  .level-nav{display:flex;justify-content:space-between;gap:.8rem;margin-top:2rem}
  /* ---------- MUSIC TRACKS ---------- */
  .track{border:1px solid #3a2a18;border-radius:12px;overflow:hidden;background:rgba(30,20,10,.5);margin-bottom:1.2rem;display:grid;grid-template-columns:150px 1fr;gap:1rem}
  .track .thumb{height:100%;min-height:150px;background:linear-gradient(160deg,#120404,#1c0a08)}
  .track .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .track .body{padding:.9rem 1rem 1rem 0}
  .track h3{font-family:var(--font-head);color:var(--gold2);font-size:1.1rem}
  .track .dur{font-size:.72rem;letter-spacing:.12em;color:#a9966f;text-transform:uppercase;margin:.1rem 0 .5rem}
  .track p{font-size:.88rem;color:#cdbfa5;margin-bottom:.7rem}
  .track audio{width:100%;height:40px}
  @media(max-width:560px){ .track{grid-template-columns:1fr} .track .thumb{max-height:180px} }
  /* ---------- QUIZ ---------- */
  .qcard{border:1px solid #3a2a18;border-radius:12px;padding:1rem 1.1rem;background:rgba(30,20,10,.5);margin-bottom:1rem}
  .qcard .qtag{font-size:.68rem;letter-spacing:.12em;color:#a9966f;text-transform:uppercase}
  .qcard .qtext{font-family:var(--font-head);color:var(--light);margin:.25rem 0 .7rem;font-size:1rem}
  .qopt{display:block;width:100%;text-align:left;background:rgba(20,12,6,.6);border:1px solid #3a2a18;border-radius:999px;color:#cdbfa5;font-family:var(--font-body);font-size:.92rem;padding:.45rem .9rem;margin:.3rem 0;cursor:pointer}
  .qopt:hover{border-color:var(--gold);color:var(--light)}
  .qopt.right{background:rgba(201,162,39,.18);border-color:var(--gold);color:var(--gold2)}
  .qopt.wrong{border-color:#8a3a2a;color:#e08a6a}
  .qfact{margin-top:.6rem;font-size:.85rem;color:#d8c8a4;font-style:italic;border-left:2px solid var(--gold);padding-left:.6rem}
  .qscore{display:flex;gap:.8rem;flex-wrap:wrap;margin:1rem 0 1.4rem}
  .qscore .chip{border:1px solid var(--gold);border-radius:999px;padding:.4rem 1rem;color:var(--gold2);font-family:var(--font-head);font-size:.95rem}
  /* ---------- GALLERY ---------- */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem;margin-top:1.5rem}
  .gitem{border:1px solid #3a2a18;border-radius:12px;overflow:hidden;background:rgba(30,20,10,.5)}
  .gitem .imgwrap{height:280px;background:linear-gradient(160deg,#120404,#1c0a08);overflow:hidden}
  .gitem img{width:100%;height:100%;object-fit:cover;display:block}
  .gitem .meta{padding:.7rem .8rem .9rem}
  .gitem .meta h3{font-size:.9rem;color:var(--light);font-weight:400;font-family:var(--font-body)}
  .gitem .meta p{font-size:.75rem;color:#a9966f;margin-top:.2rem}
  /* ---------- MUSIC ---------- */
  .music-note{max-width:40rem;color:#cdbfa5;margin:1rem 0 1.2rem}
  .player{border:1px solid #3a2a18;border-radius:12px;overflow:hidden;background:rgba(20,12,6,.6);margin-bottom:1.2rem}
  .player iframe{width:100%;height:150px;border:0;display:block}
  .player .meta{padding:.7rem .9rem;font-size:.8rem;color:#a9966f}
  footer{margin-top:3.5rem;border-top:1px solid #3a2a18;padding-top:1.2rem;font-size:.72rem;color:#8a774f}
  footer p{margin-bottom:.3rem}
  @media(min-width:700px){ .level-art{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<nav>
  <span class="brand" id="brandHome">✦ Journey Through the Divine Comedy</span>
  <div class="tabs" id="tabs">
    <button data-tab="home" class="active">Home</button>
    <button data-tab="journey">The Journey</button>
    <button data-tab="gallery">Art Gallery</button>
    <button data-tab="music">Music</button>
    <button data-tab="quiz">Quiz</button>
  </div>
  <div id="progressWrap">
    <div id="progressBar"><div id="progressFill"></div></div>
    <div id="progressLabel">0 of 30 realms</div>
  </div>
</nav>
<main id="app"></main>

<script>
/* ================= DATA ================= */
const wm = f => "https://commons.wikimedia.org/wiki/Special:FilePath/" + encodeURIComponent(f) + "?width=1000";

const CANTICLES = [
{
  id:"inferno", title:"Inferno", subtitle:"The Descent",
  desc:"Nine circles spiral downward from the lost wood to the frozen pit of Cocytus.",
  cls:"c-inferno",
  levels:[
    { name:"The Dark Wood", epithet:"Nel mezzo del cammin di nostra vita", motif:"wood",
      blurb:"Midway through life, the pilgrim wakes in a dark wood, the straight path lost. Three beasts bar the way, until a figure from antiquity steps out of the silence: the poet Virgil, sent by a lady named Beatrice.",
      quote:{ it:"Nel mezzo del cammin di nostra vita / mi ritrovai per una selva oscura, / ché la diritta via era smarrita.",
              en:"Midway upon the journey of our life / I found myself within a forest dark, / For the straightforward pathway had been lost.",
              attr:"Dante, Inferno I, in Henry Wadsworth Longfellow's translation" },
      art:{ file:"Dante lost in the dark forest, illustration to Dante’s Inferno by Gustave Doré.jpg", cap:"Gustave Doré, Dante lost in the dark forest (Inferno I)" } },
    { name:"The Gate of Hell", epithet:"Lasciate ogne speranza, voi ch'intrate", motif:"gate",
      blurb:"An inscription forged in iron colors seals the gate. Beyond it lie the uncommitted souls, stung forever by wasps and flies, and the river Acheron, where the ferryman Charon poles his crowded boat toward the far shore.",
      quote:{ it:"Lasciate ogne speranza, voi ch'intrate.",
              en:"All hope abandon, ye who enter in.",
              attr:"Dante, Inferno III, in Longfellow's translation" },
      art:{ file:"Gustave Doré - Dante Alighieri - Inferno - Plate 8 (Canto III - Abandon all hope ye who enter here).jpg", cap:"Gustave Doré, 'Abandon all hope, ye who enter here' (Inferno III)" } },
    { name:"Limbo", epithet:"First Circle", motif:"mist",
      blurb:"A realm of sighs rather than torments: the virtuous unbaptized dwell in a dim noble castle. Homer, Horace, Ovid, and the great ancients honor Dante as one of their own, and here he learns even wisdom has its borders.",
      quote:{ en:"And more of honor still, much more, they did me, / In that they made me one of their own band; / So that the sixth was I, 'mid so much wit.",
              attr:"Dante honored by the ancient poets, Inferno IV, in Longfellow's translation" },
      art:{ file:"Gustave Doré - Dante Alighieri - Inferno - Plate 10 (Canto III - Charon herds the sinners onto his boat).jpg", cap:"Gustave Doré, Charon herds the sinners onto his boat (Inferno III)" } },
    { name:"Lust", epithet:"Second Circle", motif:"whirl",
      blurb:"In the howling dark, souls are swept in an endless gale, riders of the storm that mirrors the wind of desire. Minos, the snarling judge, coils his tail to assign each shade its place. Among the blown-about lovers, Francesca da Rimini tells her tale, and Dante faints with pity.",
      quote:{ it:"Nessun maggior dolore / che ricordarsi del tempo felice / nella miseria.",
              en:"There is no greater sorrow / Than to be mindful of the happy time / In misery.",
              attr:"Francesca da Rimini's words, Inferno V, in Longfellow's translation" },
      art:{ file:"Gustave Doré - Dante Alighieri - Inferno - Plate 13 (Canto V - Minos).jpg", cap:"Gustave Doré, Minos (Inferno V)" } },
    { name:"Gluttony", epithet:"Third Circle", motif:"rain",
      blurb:"Cold filthy rain falls without pause on the souls sprawled beneath it, harried by Cerberus, the three-throated worm. Here the gluttonous lie like swine in mire, each drop of water a small eternity of appetite reversed.",
      quote:{ en:"You citizens were wont to call me Ciacco; / For the pernicious sin of gluttony / I, as thou seest, am battered by this rain.",
              attr:"Ciacco of Florence, Inferno VI, in Longfellow's translation" },
      art:{ file:"Inferno Canto 6 - Cerberus (148618330).jpg", cap:"Gustave Doré, Cerberus over the gluttons (Inferno VI)" } },
    { name:"Greed", epithet:"Fourth Circle", motif:"weight",
      blurb:"Two mobs roll enormous weights in half-circles, crashing into each other and screaming their twin reproaches: 'Why hoard?' and 'Why waste?' Fortune, says Virgil, turns her wheel and needs no blame.",
      quote:{ en:"Now canst thou, Son, behold the transient farce / Of goods that are committed unto Fortune, / For which the human race each other buffet; / For all the gold that is beneath the moon / Or ever has been, of these weary souls / Could never make a single one repose.",
              attr:"Virgil on Fortune, Inferno VII, in Longfellow's translation" },
      art:{ file:"Inferno Canto 7 lines 8-9.jpg", cap:"Gustave Doré, Plutus and the fourth circle (Inferno VII)" } },
    { name:"Wrath", epithet:"Fifth Circle", motif:"swamp",
      blurb:"The Styx is a black marsh where the wrathful tear at one another on the surface and the sullen bubble below, gurgling their hymn through the mud. At the far bank, the walls of the city of Dis rise red through the fog.",
      quote:{ en:"As he who listens to some great deceit / That has been done to him, and then resents it, / Such became Phlegyas, in his gathered wrath.",
              attr:"Inferno VIII, in Longfellow's translation" },
      art:{ file:"DVinfernoFerryAcrossTheStyx m.jpg", cap:"Gustave Doré, Phlegyas ferrying across the Styx (Inferno VIII)" } },
    { name:"Heresy", epithet:"Sixth Circle", motif:"tomb",
      blurb:"Inside Dis, a field of open tombs glows like a city of ember-lit hearths. Epicureans, who denied the soul's immortality, lie in chests of fire that will one day be sealed forever. Farinata, unbowed even in death, rises to speak with Dante.",
      quote:{ it:"O Tosco che per la città del foco…",
              en:"O Tuscan, thou who through the city of fire / Goest alive, thus speaking modestly, / Be pleased to stay thy footsteps in this place.",
              attr:"Farinata degli Uberti, Inferno X, in Longfellow's translation" },
      art:{ file:"DVinfernoUbertiAddressesDante m.jpg", cap:"Gustave Doré, Farinata rises from his tomb (Inferno X)" } },
    { name:"Violence", epithet:"Seventh Circle", motif:"fire-ring",
      blurb:"Three rings: a river of boiling blood patrolled by centaurs; a wood where the suicides grow as twisted trees, bleeding when the Harpies break them; and a burning plain where fire falls like snow on the violent against God. The aging Brunetto Latini walks briefly beside his student.",
      quote:{ en:"And he in the midst, who at his breast is gazing, / Is the great Chiron, who brought up Achilles; / That other Pholus is, who was so wrathful.",
              attr:"Nessus naming the centaurs, Inferno XII, in Longfellow's translation" },
      art:{ file:"Gustave Doré - The Inferno, Canto 12-1.jpg", cap:"Gustave Doré, The centaurs and the river of blood (Inferno XII)" } },
    { name:"Fraud", epithet:"Eighth Circle, Malebolge", motif:"ditch",
      blurb:"Ten concentric ditches of stone, an iron funnel of deception: seducers scourged, flatterers drowned in excrement, simonists planted upside down in baptismal holes, fortune-tellers with heads twisted backward, thieves entwined with serpents. Geryon carries the poets down on his patterned back.",
      quote:{ en:"There is a place in Hell called Malebolge, / Wholly of stone and of an iron color, / As is the circle that around it turns.",
              attr:"Inferno XVIII, in Longfellow's translation" },
      art:{ file:"DVinfernoShadeOfThais m.jpg", cap:"Gustave Doré, The flatterers in Malebolge (Inferno XVIII)" } },
    { name:"Treachery", epithet:"Ninth Circle, Cocytus", motif:"ice",
      blurb:"At the earth's very floor, a frozen lake where betrayal locks the soul in ice. Count Ugolino gnaws eternally on the archbishop who starved him. And at the center, vast as a windmill, half-imbedded in ice, Lucifer beats his three faces' wings, the engine of the eternal frost.",
      quote:{ en:"Thou hast to know I was Count Ugolino, / And this one was Ruggieri the Archbishop; / Now I will tell thee why I am such a neighbor.",
              attr:"Count Ugolino, Inferno XXXIII, in Longfellow's translation" },
      art:{ file:"Gustave Dore Inferno34.jpg", cap:"Gustave Doré, Lucifer (Inferno XXXIV)" } }
  ]
},
{
  id:"purgatorio", title:"Purgatorio", subtitle:"The Mountain",
  desc:"Seven terraces wind up the mountain, where souls purge themselves toward freedom.",
  cls:"c-purgatorio",
  levels:[
    { name:"The Shore of Antipurgatory", epithet:"Purgatorio I", motif:"shore",
      blurb:"Climbing Lucifer's flanks, the poets emerge to see stars again, and the island-mountain of Purgatory rising from the sea. The guardian Cato, a pagan soul made free, orders them to wash Hell's grime away and gird themselves for ascent.",
      quote:{ it:"Per correr miglior acque alza le vele / omai la navicella del mio ingegno, / che lascia dietro a sé mar crudele;",
              en:"To run o'er better waters hoists its sail / The little vessel of my genius now, / That leaves behind itself a sea so cruel; / And of that second kingdom will I sing / Wherein the human spirit doth purge itself, / And to ascend to heaven becometh worthy.",
              attr:"Purgatorio I, in Longfellow's translation" },
      art:{ file:"Pur 01 dore.jpg", cap:"Gustave Doré, Cato of Utica (Purgatorio I)" } },
    { name:"Pride", epithet:"First Terrace", motif:"weight2",
      blurb:"Souls, bent beneath boulders, circle slowly and pray the Lord's Prayer in its most humbling line. Carved in the rock are scenes of humility: David dancing before the ark, Trajan and the widow. When pride's weight is gone, the souls straighten and sing.",
      quote:{ en:"O ye proud Christians! wretched, weary ones! / Who, in the vision of the mind infirm / Confidence have in your backsliding steps, / Do ye not comprehend that we are worms, / Born to bring forth the angelic butterfly / That flieth unto judgment without screen?",
              attr:"Purgatorio X, in Longfellow's translation" },
      art:{ file:"Pur 10.jpg", cap:"Gustave Doré, The prideful beneath their stones (Purgatorio X)" } },
    { name:"Envy", epithet:"Second Terrace", motif:"veil",
      blurb:"The envious wear haircloth cloaks, eyes sewn shut with wire, leaning on one another like the blind. Voices in the air sing of generosity and of Mary's humility; the terrace's carved example is the widow who gave her two coins.",
      quote:{ en:"Sapient I was not, although I Sapia / Was called, and I was at another's harm / More happy far than at my own good fortune.",
              attr:"Sapia the Sienese, Purgatorio XIII, in Longfellow's translation" },
      art:{ file:"Pur 13.jpg", cap:"Gustave Doré, The envious with sewn eyes (Purgatorio XIII)" } },
    { name:"Wrath", epithet:"Third Terrace", motif:"smoke",
      blurb:"In acrid smoke that mirrors the blinding fog of rage, souls sing 'Agnus Dei' while visions of gentleness flash before their inner eyes: the martyr Stephen praying for his killers.",
      quote:{ it:"Lo mondo è cieco, e tu vien ben da esso",
              en:"Brother, / The world is blind, and sooth thou comest from it! / If this were so, in you would be destroyed / Free will, nor any justice would there be / In having joy for good, or grief for evil.",
              attr:"Marco Lombardo on free will, Purgatorio XVI, in Longfellow's translation" },
      art:{ file:"Pur 15.jpg", cap:"Gustave Doré, Purgatorio XV" } },
    { name:"Sloth", epithet:"Fourth Terrace", motif:"run",
      blurb:"Here souls cure lukewarmness with zeal: they run ceaselessly around the terrace, shouting examples of holy haste and the fate of the dilatory, too late. Two radiant souls, the poet Statius among them, overtake the pilgrims at a bound.",
      quote:{ en:"The soul, which is created apt to love, / Is mobile unto everything that pleases, / Soon as by pleasure she is waked to action.",
              attr:"Virgil on love, Purgatorio XVIII, in Longfellow's translation" },
      art:{ file:"Pur 18.jpg", cap:"Gustave Doré, Purgatorio XVIII" } },
    { name:"Avarice", epithet:"Fifth Terrace", motif:"flat",

/* ================= VISUAL MOTIFS (procedural SVG) ================= */
function rnd(seed){ let s=seed; return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
const PALETTES={
  inferno:["#120404","#7a1f0e","#ff7a3c"], purgatorio:["#0d1428","#3d5a80","#9fb4d8"],
  paradiso:["#1c2340","#87a7ff","#fffbe8"]
};
function motifSVG(m,cant,i){
  const p=PALETTES[cant]; const r=rnd(i*77+13); let el="";
  const n=14;
  for(let k=0;k<n;k++){
    const x=r()*100,y=r()*80+8,s=r()*8+3,o=(0.12+r()*0.35).toFixed(2);
    switch(m){
      case "wood": el+=`<rect x="${x}" y="5" width="${(1+r()*2).toFixed(1)}" height="90" fill="#000" opacity="${o}"/>`; break;
      case "gate": el+=`<circle cx="${x+10}" cy="${y+5}" r="${s}" fill="none" stroke="${p[1]}" stroke-width=".6" opacity="${o}"/>`; break;
      case "mist": el+=`<ellipse cx="${x*1.2}" cy="${y+10}" rx="${s*2.4}" ry="${s*.7}" fill="${p[2]}" opacity="${(o/2).toFixed(2)}"/>`; break;
      case "whirl": el+=`<path d="M ${x} ${y} q ${s} ${-s} ${s*2} 0 q ${s} ${s} ${s*2} 0" stroke="${p[2]}" fill="none" stroke-width=".7" opacity="${o}"/>`; break;
      case "rain": el+=`<line x1="${x}" y1="${y}" x2="${x-4}" y2="${y+16}" stroke="${p[2]}" stroke-width=".8" opacity="${o}"/>`; break;
      case "weight": case "weight2": el+=`<rect x="${x}" y="${y}" width="${s*1.6}" height="${s*1.6}" fill="${p[1]}" opacity="${o}" transform="rotate(${(r()*40-20).toFixed(0)} ${x} ${y})"/>`; break;
      case "swamp": el+=`<path d="M ${x} ${y} q 6 -3 12 0 t 12 0" stroke="${p[1]}" fill="none" stroke-width=".8" opacity="${o}"/>`; break;
      case "tomb": el+=`<rect x="${x}" y="${y}" width="${s*2}" height="${s*1.3}" fill="none" stroke="${p[2]}" stroke-width=".6" opacity="${o}"/>`; break;
      case "fire-ring": case "flame2": el+=`<path d="M ${x} ${y+s} q ${s} ${-s*2.2} 0 ${-s*3} q ${-s} ${s*.8} 0 ${s*3} z" fill="${p[2]}" opacity="${o}"/>`; break;
      case "ditch": el+=`<path d="M ${x-14} ${y+8} Q ${x} ${y-4} ${x+14} ${y+8}" stroke="${p[1]}" fill="none" stroke-width="1" opacity="${o}"/>`; break;
      case "ice": el+=`<path d="M ${x} ${y-s} L ${x+s*.9} ${y} L ${x} ${y+s} L ${x-s*.9} ${y} Z" fill="none" stroke="${p[2]}" stroke-width=".7" opacity="${o}"/>`; break;
      case "shore": el+=`<path d="M ${x-15} ${y} q 7 ${-4} 15 0 t 15 0" stroke="${p[2]}" fill="none" stroke-width=".7" opacity="${o}"/>`; break;
      case "veil": el+=`<line x1="${x}" y1="${y-6}" x2="${x+r()*8-4}" y2="${y+14}" stroke="${p[2]}" stroke-width=".6" opacity="${o}"/>`; break;
      case "smoke": el+=`<circle cx="${x}" cy="${y}" r="${s}" fill="${p[1]}" opacity="${o}"/>`; break;
      case "run": el+=`<path d="M ${x-8} ${y} h 16" stroke="${p[2]}" stroke-width=".7" opacity="${o}"/>`; break;
      case "flat": el+=`<rect x="${x-12}" y="${y+4}" width="24" height="1.2" fill="${p[1]}" opacity="${o}"/>`; break;
      case "tree": el+=`<circle cx="${x}" cy="${y}" r="${s*.8}" fill="${p[2]}" opacity="${(o/2).toFixed(2)}"/>`; break;
      case "forest": el+=`<circle cx="${x}" cy="${y}" r="${s}" fill="none" stroke="${p[2]}" stroke-width=".5" opacity="${o}"/>`; break;
      case "moon": el+=`<circle cx="${x}" cy="${y}" r="${s}" fill="${p[2]}" opacity="${(o/2.5).toFixed(2)}"/>`; break;
      case "star": case "stars": el+=`<path d="M ${x} ${y-s} L ${x+s*.3} ${y-s*.3} L ${x+s} ${y} L ${x+s*.3} ${y+s*.3} L ${x} ${y+s} L ${x-s*.3} ${y+s*.3} L ${x-s} ${y} L ${x-s*.3} ${y-s*.3} Z" fill="${p[2]}" opacity="${o}"/>`; break;
      case "rose": el+=`<circle cx="${x}" cy="${y}" r="${s}" fill="none" stroke="${p[2]}" stroke-width=".5" opacity="${o}"/>`; break;
      case "sun": el+=`<line x1="${x-s}" y1="${y}" x2="${x+s}" y2="${y}" stroke="${p[2]}" stroke-width=".6" opacity="${o}"/><line x1="${x}" y1="${y-s}" x2="${x}" y2="${y+s}" stroke="${p[2]}" stroke-width=".6" opacity="${o}"/>`; break;
      case "cross": el+=`<line x1="${x}" y1="${y-s}" x2="${x}" y2="${y+s}" stroke="${p[2]}" stroke-width=".7" opacity="${o}"/><line x1="${x-s}" y1="${y-s*.4}" x2="${x+s}" y2="${y-s*.4}" stroke="${p[2]}" stroke-width=".7" opacity="${o}"/>`; break;
      case "eagle": el+=`<path d="M ${x-s} ${y} Q ${x} ${y-s} ${x+s} ${y}" fill="none" stroke="${p[2]}" stroke-width=".7" opacity="${o}"/>`; break;
      case "ladder": el+=`<line x1="${x}" y1="90" x2="${x}" y2="${y}" stroke="${p[2]}" stroke-width=".5" opacity="${o}"/>`; break;
      case "wheel": el+=`<circle cx="${x}" cy="${y}" r="${s}" fill="none" stroke="${p[2]}" stroke-width=".5" opacity="${o}"/><circle cx="${x}" cy="${y}" r="${s*.5}" fill="none" stroke="${p[2]}" stroke-width=".5" opacity="${o}"/>`; break;
      default: el+=`<circle cx="${x}" cy="${y}" r="${s}" fill="${p[2]}" opacity="${o}"/>`;
    }
  }
  return `<svg class="motif" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="g${cant}${i}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="${p[0]}"/><stop offset="100%" stop-color="${p[1]}"/></linearGradient></defs>
    <rect width="100" height="100" fill="url(#g${cant}${i})"/>${el}</svg>`;
}

const app=document.getElementById("app");
let tab="home";

function esc(s){ return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function levelCard(l){
  const done=progress.completed.includes(l.i);

    <div class="txt"><div class="num">${l.canticleTitle} · ${l.epithet}</div><div class="name">${esc(l.name)}</div></div>
  </div>`;
}

function openLevel(i){
  const l=FLAT[i]; if(!l) return;
  if(i<=progress.current || progress.completed.includes(i-1) || i===0 || progress.completed.includes(i) || progress.current===i){ /* allowed */ }
  if(i>progress.current && !progress.completed.includes(i-1) && !progress.completed.includes(i) && i>progress.current){ /* soft-lock: still allow viewing ahead? choose: block */ }
  if(i>progress.current+0 && !progress.completed.includes(i) && i!==progress.current && !progress.completed.includes(i-1)){
    // level not yet reachable: gently nudge
    openLevel(progress.current); return;
  }
  if(i===progress.current){ progress.current=i; }
  showTab("level",i);
}
function renderLevel(i){
  const l=FLAT[i]; const prev=i>0?FLAT[i-1]:null, next=i<FLAT.length-1?FLAT[i+1]:null;

  const last = i===FLAT.length-1;
  app.innerHTML=`
  <div id="levelView">
    <div class="crumbs">${l.canticleTitle} · Realm ${i+1} of ${FLAT.length}</div>
    <h2>${esc(l.name)}</h2>
    <div class="epithet">${esc(l.epithet)}</div>
    <div class="level-art">
      <div class="artframe">${motifSVG(l.motif,l.canticle,i)}
        ${l.art?`<img src="${wm(l.art.file)}" alt="${esc(l.art.cap)}" onerror="this.remove()"/>
        <div class="cap">${esc(l.art.cap)}</div>`:""}
      </div>
      <div>
        <div class="level-text"><p>${esc(l.blurb)}</p></div>
        ${l.quote?`<div class="level-quote">
          ${l.quote.it?`<div class="it">${esc(l.quote.it)}</div>`:""}
          <div class="en">“${esc(l.quote.en)}”</div>
          <div class="attr">— ${esc(l.quote.attr)}</div>
        </div>`:""}
      </div>
    </div>
    <div class="level-nav">
      <button class="btn" id="prevBtn">← ${prev?esc(prev.name):"The Map"}</button>
      ${done
        ? (next?`<button class="btn primary" id="nextBtn">Continue to ${esc(next.name)} →</button>`:`<button class="btn primary" id="finBtn">✦ Behold the Rose ✦</button>`)
        : (last
            ? `<button class="btn primary" id="nextBtn">Complete the Journey ✦</button>`
            : `<button class="btn primary" id="nextBtn">Pass onward to ${next?esc(next.name):""} →</button>`)}
    </div>
  </div>
  <footer><p>Engravings © public domain, Gustave Doré, via Wikimedia Commons. Translation excerpts: Henry Wadsworth Longfellow, 1865–67, public domain.</p></footer>`;
  const pb=document.getElementById("prevBtn");
  pb.onclick=()=>{ if(prev) openLevel(prev.i); else showTab("journey"); };
  const nb=document.getElementById("nextBtn");
  if(nb) nb.onclick=()=>{
    if(!progress.completed.includes(i)) progress.completed.push(i);
    progress.current=Math.min(i+1,FLAT.length-1);
    if(last){ progress.completed.includes(i)||progress.completed.push(i); showFinale(); }
    else openLevel(progress.current);
    save(); updateProgressUI();
  };
  const fb=document.getElementById("finBtn");
  if(fb) fb.onclick=showFinale;
  if(!progress.completed.includes(i)){
    const mark=(e)=>{ if(!progress.completed.includes(i)){progress.completed.push(i);progress.current=Math.min(i+1,FLAT.length-1);save();updateProgressUI();renderLevel(i);} };
    nb&&nb.addEventListener("click",mark,{once:true});
  }
}

const RANKS = [
  [0,   "Novice of the Dark Wood"],
  [30,  "Pilgrim at the Gate"],
  [60,  "Passenger of Charon"],
  [90,  "Wanderer of the Nine Circles"],
  [120, "Climber of the Seven Terraces"],
  [150, "Citizen of the Earthly Paradise"],
  [180, "Voyager among the Spheres"],
  [210, "Contemplative of the Primum Mobile"],
  [240, "Star-Borne Pilgrim"],
  [270, "Chosen of the Empyrean Rose"],
  [300, "Beatific Vision"]
];
function rankFor(p){
  let rank = RANKS[0][1], next = null;
  for (const r of RANKS) { if (p >= r[0]) { rank = r[1]; } else { next = r; break; } }
  return { rank, next };
}
function renderQuiz(){
  const pts = progress.points || 0;
  const { rank, next } = rankFor(pts);
  const total = QUIZ.length;
  const correct = QUIZ.reduce((n, _, i) => n + (progress.quiz[i] && progress.quiz[i].correct ? 1 : 0), 0);
  const nextHint = next ? " — " + (next[0] - pts) + " more points to " + next[1] : " — the summit reached!";
  app.innerHTML = `
  <h2 style="font-size:1.6rem;margin-top:1rem">The Pilgrim's Quiz</h2>
  <p style="color:#a9966f;font-style:italic;margin:.3rem 0">Thirty questions, one for each realm of the journey. Ten points for each first correct answer; wrong turns cost you nothing but time. Your rank rises as your knowledge deepens.</p>
  <div class="qscore">
    <span class="chip">Rank: ${esc(rank)}</span>
    <span class="chip">${pts} points</span>
    <span class="chip">${correct} of ${total} answered truly</span>
  </div>
  <p style="font-size:.85rem;color:#a9966f;margin-bottom:1.4rem">${esc(pts + nextHint)}</p>
  ${QUIZ.map((z, i) => {
    const st = progress.quiz[i] || null;
    const realm = FLAT[z.realm];
    const opts = z.opts.map((o, oi) => {
      let cls = "qopt";
      if (st && st.correct && oi === z.a) cls += " right";
      else if (st && !st.correct && st.picked === oi) cls += " wrong";
      return `<button class="${cls}" data-q="${i}" data-o="${oi}">${esc(o)}</button>`;
    }).join("");
    const fact = st && st.correct ? `<div class="qfact">${esc(z.fact)}</div>` : (st && !st.correct ? `<div class="qfact">Not quite, pilgrim — look again and try once more.</div>` : "");
    return `<div class="qcard">
      <div class="qtag">${esc(realm.canticleTitle)} · ${esc(realm.name)}</div>
      <div class="qtext">${esc(z.q)}</div>
      ${opts}${fact}
    </div>`;
  }).join("")}
  <footer><p>All facts drawn from Dante's Divine Comedy, Longfellow's 1867 translation (public domain).</p></footer>`;
  app.querySelectorAll(".qopt").forEach(b => b.onclick = () => {
    const qi = +b.dataset.q, oi = +b.dataset.o;
    const z = QUIZ[qi];
    const st = progress.quiz[qi];
    if (st && st.correct) return;
    const hadCorrect = st && st.correct;
    const isRight = oi === z.a;
    progress.quiz[qi] = { picked: oi, correct: isRight };
    if (isRight && !hadCorrect) progress.points = (progress.points || 0) + 10;
    save(); renderQuiz(); updateProgressUI();
  });
}

function showTab(t,levelIdx){
  tab=t;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t||(t==="level"&&b.dataset.tab==="journey")));
  if(t==="home")renderHome();
  else if(t==="journey")renderJourney();
  else if(t==="gallery")renderGallery();
  else if(t==="music")renderMusic();
  else if(t==="quiz")renderQuiz();
  else if(t==="level")renderLevel(levelIdx);
  window.scrollTo({top:0,behavior:"instant"});
}
function render(){ if(tab==="level")renderLevel(progress.current); else showTab(tab); updateProgressUI(); }
